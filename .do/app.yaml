# DigitalOcean App Platform spec
# Deploy with: doctl apps create --spec .do/app.yaml
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: hikid

services:
  - name: web
    # Build from the repo root using the Dockerfile
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      # ▶ Change these to your fork's GitHub org/repo and branch
      repo: YOUR_GITHUB_USERNAME/hi-kid
      branch: main
      deploy_on_push: true

    # DigitalOcean injects $PORT automatically; the server reads it.
    http_port: 8080
    instance_size_slug: basic-xxs   # cheapest tier (~$5/month)
    instance_count: 1

    # Health check — the /api/deps endpoint always returns 200 in web mode
    health_check:
      http_path: /api/deps
      initial_delay_seconds: 10
      period_seconds: 30

    envs:
      # ▶ Set OPENAI_API_KEY as a secret in the App Platform dashboard
      #   (do NOT paste the key here — leave type: SECRET)
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET

      # Optional overrides — remove any you don't need
      - key: NODE_ENV
        scope: RUN_TIME
        value: production

      # Override the LLM endpoint if you want something other than OpenAI
      # - key: LLM_BASE_URL
      #   value: https://api.openai.com/v1
      # - key: LLM_MODEL
      #   value: gpt-4o-mini
